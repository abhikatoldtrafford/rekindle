[project]
name = "rekindle"
version = "0.1.1"
description = "Turn a folder of photos into memories - slideshows with music, entirely on your own machine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Abhik Maiti", email = "abhikatoldtrafford@gmail.com" }]
keywords = [
    "photos",
    "google-takeout",
    "slideshow",
    "memories",
    "photo-library",
    "exif",
    "local-first",
    "privacy",
]
# Trove classifiers, chosen to be TRUE rather than aspirational. No
# "Programming Language :: Python :: 3.13" until it is tested; no
# "Development Status :: 5 - Production/Stable" for a 0.1.0.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pillow>=11.1.0",
    "defusedxml>=0.7.1",
    "typer>=0.15.0",
    "rich>=13.9.0",
    # Windows ships no tz database, so zoneinfo cannot resolve "Asia/Kolkata"
    # and the GPS->timezone rung silently degrades to "assume UTC".
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
heic = ["pillow-heif>=1.7.0"]

# Semantic features (embeddings, search, scene clusters, aesthetics, the face
# gate). NEITHER extra is installed by `uv sync`, and CI never installs them:
# every semantic feature degrades to a message naming the command to run.
#
# Two extras, not one, because the split is real: `semantic` is ~120 MB of
# ONNX runtime and numpy and runs everything on CPU; `semantic-gpu` adds 2.5 GB
# of torch for the CUDA path. A contributor who wants to run the tests or try
# a search does not need the second.
semantic = [
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.26",
    "tokenizers>=0.20",
]
semantic-gpu = [
    "numpy>=2.1",
    "huggingface-hub>=0.26",
    "torch>=2.6",
    "transformers>=4.45",
]

[project.urls]
Homepage = "https://github.com/abhikatoldtrafford/rekindle"
Repository = "https://github.com/abhikatoldtrafford/rekindle"
Issues = "https://github.com/abhikatoldtrafford/rekindle/issues"
"Known limitations" = "https://github.com/abhikatoldtrafford/rekindle/blob/main/docs/known-limitations.md"
Contributing = "https://github.com/abhikatoldtrafford/rekindle/blob/main/CONTRIBUTING.md"

[project.scripts]
rekindle = "rekindle.cli:app"

[dependency-groups]
# numpy is here, in the DEV group, not in `dependencies`. It is never shipped
# to a user who only wants `rekindle index`, but it IS installed by a plain
# `uv sync`, so CI actually RUNS the search, clustering and aesthetic tests
# instead of skipping them. A skipped test is not a passing test, and those
# three modules are where the arithmetic that can be silently wrong lives.
# onnxruntime, torch and transformers stay out: CI must never need them.
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "ruff>=0.8.0", "numpy>=2.1"]

# PyPI's Windows torch wheel is CPU-ONLY: `pip install torch` on Windows gives
# you a build whose torch.version.cuda is None, and the only symptom is that
# embedding runs two orders of magnitude slower. The CUDA wheels live on
# PyTorch's own index. `explicit = true` means this index is consulted ONLY for
# packages mapped to it below, so adding it cannot change how any other
# dependency resolves.
#
# Restricted to Windows and Linux by marker: there are no CUDA wheels for macOS
# at all, and on macOS the PyPI wheel already has Metal support.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rekindle"]

# THE SDIST IS A WHITELIST, NOT A BLACKLIST, and that is not fastidiousness.
#
# This repository sits next to a 61 GB personal photo export. Hatchling's
# default is "everything git does not ignore", and `.gitignore` here contains
# `!.env.example`, a NEGATION - which un-ignores that filename at any depth.
# The first sdist built from this tree therefore reached into
# `.claude/worktrees/*/` and packaged three other agents' copies of it. Nothing
# secret escaped, but the mechanism would have packaged anything else those
# directories held, and this is a public package with no undo.
#
# So the sdist lists what it wants. A file that is not named here cannot be
# shipped by accident, whatever anyone later puts in this directory.
# `tests/test_packaging.py` asserts the negative: no photo, no database, no
# worktree, nothing outside these paths.
[tool.hatch.build.targets.sdist]
include = [
    "/src/rekindle",
    "/tests",
    "/docs/*.md",
    "/.github/workflows",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff formats Python fences inside markdown. Documentation is prose with
# illustrative code, not shipped source - letting the formatter rewrite plans
# and specs is churn that fights the author, and it has already turned CI red
# once. Lint and format the source tree only.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
