[project]
name = "rekindle"
version = "0.1.0"
description = "Turn your photo library into memories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11.1.0",
    "defusedxml>=0.7.1",
    "typer>=0.15.0",
    "rich>=13.9.0",
    # Windows ships no tz database, so zoneinfo cannot resolve "Asia/Kolkata"
    # and the GPS->timezone rung silently degrades to "assume UTC".
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
heic = ["pillow-heif>=1.7.0"]

[project.scripts]
rekindle = "rekindle.cli:app"

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rekindle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
